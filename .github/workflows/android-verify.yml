name: ShopEase Android build verification

on:
  push:
    branches: [main, assignment-2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Java and XML source
        run: python3 scripts/verify_source.py

      - name: Assemble Android debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopEase-v2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
